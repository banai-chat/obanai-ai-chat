<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obanai AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111013;
      color: #f5f0f4;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      background: #1c191e;
      border-bottom: 1px solid #493541;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      color: #e8a9c8;
    }

    header p {
      margin: 7px 0 0;
      font-size: 13px;
      color: #b9aeb8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-start;
      background: #493043;
      border-bottom-left-radius: 4px;
    }

    .assistant {
      align-self: flex-end;
      background: #252127;
      border: 1px solid #493541;
      border-bottom-right-radius: 4px;
    }

    .sender {
      display: block;
      margin-bottom: 5px;
      color: #e8a9c8;
      font-size: 12px;
      font-weight: bold;
    }

    #status {
      min-height: 22px;
      padding: 0 16px;
      color: #c9a8bb;
      font-size: 13px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1c191e;
      border-top: 1px solid #493541;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 120px;
      border: 1px solid #51414f;
      outline: none;
      border-radius: 14px;
      background: #29252c;
      color: white;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
    }

    #messageInput:focus {
      border-color: #d38bb2;
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #a75e86;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .welcome {
      margin: auto;
      text-align: center;
      color: #c5b7c3;
      line-height: 1.9;
    }

    .welcome strong {
      color: #e8a9c8;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🐍 Obanai AI Chat</h1>
    <p>تحدثي مع أوباناي أگورو</p>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <strong>أوباناي أگورو</strong>
      <div>...ينتظر أن تبدئي الحديث</div>
    </div>
  </main>

  <div id="status" role="status"></div>

  <form class="input-area" id="chatForm">
    <textarea
      id="messageInput"
      placeholder="اكتبي رسالتچ هنا..."
      rows="1"
      required
    ></textarea>
    <button id="sendButton" type="submit">إرسال</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("status");
    const welcome = document.getElementById("welcome");

    const conversation = [];

    const systemPrompt = `

تحدث وتصرف بشخصية أوباناي، وبأسلوب قريب من شخصيته المعروفة:
هادئ، حذر، قليل الكلام أحياناً
