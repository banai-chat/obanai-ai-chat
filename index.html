<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obanai Chat</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .status { color: #4caf50; font-weight: bold; margin-bottom: 15px; }
        .quick-actions { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 5px; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn-danger { background: #b71c1c; border-color: #7f0000; }
        .chat-container { border: 1px solid #333; background: #1a1a1a; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 15px; margin-bottom: 15px; }
        .msg-box { margin-bottom: 15px; padding: 10px; border-radius: 6px; }
        .msg-bot { background: #252525; border-right: 4px solid #4caf50; }
        .msg-user { background: #2e3b4e; border-right: 4px solid #2196f3; }
        .msg-name { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #bbb; }
        .composer { display: flex; gap: 8px; }
        textarea { flex: 1; background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; resize: none; }
        .send-btn { background: #4caf50; color: white; border: none; padding: 0 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="status" id="onlineStatus">• متصل بأوباناي</div>
    
    <div class="quick-actions">
        <button class="btn quick-btn" data-text="*ينظر إليك بطرف عينه ويعدل كمامته* وش تبين؟">حوار حذر</button>
        <button class="btn quick-btn" data-text="*تتحرك الأفعى كابورامارو وتصدر فحيحاً*">حركة الأفعى</button>
        <button class="btn btn-danger" id="clearBtn">إعادة البدء</button>
    </div>

    <div class="chat-container" id="messages"></div>

    <form class="composer" id="form">
        <textarea id="input" rows="2" placeholder="اكتبي ردج هنا..."></textarea>
        <button type="submit" class="send-btn">إرسال</button>
    </form>

    <input type="hidden" id="memoryText" value="المكان: مقر فيلق قاتلي الشياطين. أوباناي شخصية باردة، صارمة، ويتكلم باللهجة العراقية المدمجة بأفعال حادة باستخدام النجمات *وصف الفعل*">

<script>
const SYSTEM_PROMPT = `أنت الآن تتقمص بشكل كامل ومطلق شخصية هاشيرا الأفعى (أوباناي إيغورو) من أنمي قاتل الشياطين.
قواعد الردود:
1. تحدث باللهجة العراقية العامية المدمجة مع طبيعتك الباردة والصارمة جداً.
2. استخدم النجمات لبيان تعابيرك وحركات الأفعى كابورامارو بالتفصيل، مثل: *يضيق عينيه وينظر بحذر*.
3. إجاباتك يجب أن تكون مفصلة، طويلة، ومثيرة للاهتمام لبناء سيناريو Roleplay ممتع. لا تختصر أبداً.`;

let history = JSON.parse(localStorage.getItem('obanai_history')) || [
    {
        role: 'assistant',
        content: `*وقف أوباناي قرب أحد الأعمدة في مقر الفيلق، وكابورامارو ملتف حول كتفيه. رفع عينيه بنظرة حذرة وباردة وهو يتكلم بصوت خافت وصارم:* "إذا ناوية تنضمين للفيلق، لا تتوقعين أحد يتساهل وياج. الثقة هنا تنبني بالمواقف، مو بكلامج هذا.."`
    }
];

const messagesContainer = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');

function renderMessages() {
    messagesContainer.innerHTML = '';
    history.forEach(msg => {
        const div = document.createElement('div');
        div.className = `msg-box ${msg.role === 'assistant' ? 'msg-bot' : 'msg-user'}`;
        const name = msg.role === 'assistant' ? 'أوباناي إيغورو' : 'أنتي';
        div.innerHTML = `<div class="msg-name">${name}</div><div>${msg.content.replace(/\n/g, '<br>')}</div>`;
        messagesContainer.appendChild(div);
    });
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

async function sendMessage(text) {
    if (!text.trim()) return;

    history.push({ role: 'user', content: text });
    renderMessages();
    input.value = '';
    document.getElementById('onlineStatus').innerText = '• أوباناي يفكر...';

    const currentMemory = document.getElementById('memoryText').value;

    const apiMessages = [
        { 
            role: 'system', 
            content: SYSTEM_PROMPT + `\n\n[الذاكرة]:\n${currentMemory}` 
        },
        ...history.slice(-8)
    ];

    try {
        const response = await fetch('https://openrouter.ai', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer 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'
            },
            body: JSON.stringify({
                model: 'meta-llama/llama-3.2-3b-instruct:free',
                messages: apiMessages,
                temperature: 0.7
            })
        });

        const data = await response.json();
        
        const hasData = data && data.choices && data.choices[0];
        if (hasData && data.choices[0]['message']) {
            const reply = data.choices[0]['message']['content'];
            history.push({ role: 'assistant', content: reply });
            localStorage.setItem('obanai_history', JSON.stringify(history));
        } else {
            throw new Error('API Error');
        }

    } catch (err) {
        console.error(err);
        history.push({ 
            role: 'assistant', 
            content: `*يصمت أوباناي قليلاً ويعقد يديه ببرود* "يبدو أن هناك مشكلة في الاتصال بالسيرفر حالياً.. حاولي مجدداً."` 
        });
    }

    document.getElementById('onlineStatus').innerText = '• متصل بأوباناي';
    renderMessages();
}

form.addEventListener('submit', e => { 
    e.preventDefault(); 
    sendMessage(input.value); 
});

document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.text));
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if(confirm('مسح المحادثة؟')) {
        localStorage.removeItem('obanai_history');
        history = [{
            role: 'assistant',
            content: `*وقف أوباناي قرب أحد الأعمدة في مقر الفيلق، وكابورامارو ملتف حول كتفيه. رفع عينيه بنظرة حذرة وباردة وهو يتكلم بصوت خافت وصارم:* "إذا ناوية تنضمين للفيلق، لا تتوقعين أحد يتساهل وياج. الثقة هنا تنبني بالمواقف، مو بكلامج هذا.."`
        }];
        renderMessages();
    }
});

renderMessages();
</script>
</body>
</html>
